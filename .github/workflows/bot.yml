name: gold-bot
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
jobs:
  bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Restore
        run: |
          rm -f trade.json
          echo '{}' > trade.json
          [ -f last_weak.json ] || echo '{"time":0}' > last_weak.json
      - run: python yalla_gold_bot.py
      - name: Save
        if: always()
        run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add trade.json last_weak.json || true
          git commit -m "save" || true
          git push || true

name: gold
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - run: pip install requests
      - run: python yalla_gold_bot.py
      - run: |
          git config --global user.name "YallaGold"
          git config --global user.email "bot@yallagold.com"
          git add trade.json daily.json || true
          git commit -m "update" || true
          git push || true

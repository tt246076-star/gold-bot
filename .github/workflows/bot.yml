name: gold

on:
  schedule:
    - cron: '*/5 * * * *'  # كل 5 دقايق ✅
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install requests
      - run: python yalla_gold_bot.py
      - name: Save trade state
        run: |
          git config --global user.name "bot"
          git config --global user.email "bot@yallagold.com"
          git add trade.json || true
          git commit -m "update trade" || true
          git push || true
